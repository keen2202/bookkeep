name: bookkeep_app
description: 极速记账 App — P0/P1 全功能（Spec v1.0）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # 审查 BK-R-015 审计结论（2026-08-07）：两包均为 sqlite3 3.x 时代 no-op 占位（原生库由 native-assets
  # hooks 提供），保留系因 drift 依赖解析需要，运行时零体积；SQLCipher 经下方 hooks source: sqlcipher 启用
  sqlcipher_flutter_libs: ^0.7.0 # 0.7.0+eol 为 sqlite3 3.x 迁移占位包（native-assets hooks 需要）；加密改由下方 hooks 提供
  sqlite3_flutter_libs: ^0.6.0 # 0.6.0+eol 为 no-op 占位（sqlite3 3.x 起由 native assets 提供库），drift 2.34 强制 sqlite3 ^3.4.0，0.5.x 无法共存
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  cryptography: ^2.9.0
  intl: ^0.20.2 # flutter_localizations 钉 0.20.2（^0.20.3 会解析冲突）
  path_provider: ^2.1.6
  # UI 重构 W4 背景系统（Spec D6）：相册选图；Android 13+ PhotoPicker / iOS 相册权限
  image_picker: ^1.2.1
  http: ^1.6.0
  uuid: ^4.6.0
  sqlite3: ^3.5.1 # 明文检测/迁移与加密打开（SQLCipher 经 native-assets hooks 提供）
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1 # 2.15.2+ 需 analyzer >=13.3.0 → meta ^1.18.3，与 flutter_test 钉死的 meta 1.18.0 冲突
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/seed/categories_seed.json

# sqlite3 3.x 起原生库由 native assets (hooks) 提供，sqlcipher_flutter_libs 已不可用；
# 此处保持 SQLCipher 加密（Spec §1.3 / BK-P0-006，openEncrypted 执行 PRAGMA key）
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
