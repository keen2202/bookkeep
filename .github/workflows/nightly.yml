name: Nightly Integration

on:
  schedule:
    - cron: '17 3 * * *'

jobs:
  server-integration:
    name: Server integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bookkeep_dev
          POSTGRES_USER: bookkeep
          POSTGRES_DB: bookkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  app-integration:
    name: App integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' # 与 build.yaml 质量门禁保持一致
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test --dart-define=CI=true
