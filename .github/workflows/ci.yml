name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  server:
    name: Server lint + unit (coverage >= 80%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bookkeep_dev
          POSTGRES_USER: bookkeep
          POSTGRES_DB: bookkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage

  app:
    name: App analyze + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
