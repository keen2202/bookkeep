name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  server:
    name: Server lint + test (coverage >= 80%, unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bookkeep_dev
          POSTGRES_USER: bookkeep
          POSTGRES_DB: bookkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 集成测试使用独立 bookkeep_test 库（审查 R-021：不污染开发库）；
      # 服务容器仅初始化 bookkeep，这里显式补建
      - name: Create integration test database
        run: |
          docker exec "$(docker ps -q --filter 'publish=5432' | head -1)" \
            psql -U bookkeep -d bookkeep -c "CREATE DATABASE bookkeep_test OWNER bookkeep"
      - run: npm run test:coverage

  app:
    name: App analyze + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' # 与 build.yaml 质量门禁保持一致
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # UI 重构静态卡点（BK-UI-011 / Spec §9）：features/ 禁裸色值/裸字号
      - run: dart run tool/check_ui_tokens.dart
      # 玻璃拟态 v3 一致性门禁（BK-GLS-011 / Spec §8）：BackdropFilter 唯一出口
      # + features 层禁 AppGlass.fill*/border* 直引
      - run: bash ../tool/check_glass_consistency.sh
      - run: flutter test --coverage
